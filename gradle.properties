# Gradle 构建参数。JDK 通过 JAVA_HOME 指定（需要 JDK 17+）。
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# versionCode 取构建时间所用的时区（传给 ZoneOffset.of，如 +08:00 / Z）。
# 提到配置里，构建脚本不写死时区；命令行可用 -Pdshm.versionCodeZoneOffset=... 覆盖。
dshm.versionCodeZoneOffset=+08:00

# lint warning 是否视为 error。2026-11-13 已清零并开启：存量 warning 全部修掉或
# 在 app/lint.xml 里按文件定向豁免（每条都写了理由），现在是「零 warning 才构建通过」。
dshm.lintWarningsAsErrors=true

