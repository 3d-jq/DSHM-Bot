name: app

# App 质量流水线：单元测试 + lint。与 README「全绿才提交」的约定对齐 ——
# lint 的「零 warning 才构建通过」（dshm.lintWarningsAsErrors=true）只在
# 本机跑没有约束力，得由 CI 兜底。
#
# 触发：push 与 PR。rootfs 构建（runtime.yml）是独立流水线，互不阻塞。
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # JDK 17+ 即可，对齐本机用的 temurin 21；cache: gradle 复用依赖与 wrapper 分发。
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      # runner 自带 Android SDK（ANDROID_HOME 已设），无需额外装。
      #
      # ⚠️ `./gradlew` 必须带执行位（git index mode 100755）。仓库从 Windows 提交时
      # 曾是 100644，CI 直接 `exit code 126`（命令存在但不可执行）—— 2026-11-14 修。
      - name: Unit tests
        run: ./gradlew --console=plain :app:testDebugUnitTest

      # abortOnError=true（见 app/build.gradle.kts 的 lint 配置），有 error 直接红。
      #
      # 失败时把 lint 报告**打成注解**：工作流日志要 admin 权限才能下载（API 403），
      # 而注解（check-runs/annotations）匿名可读 —— 否则 CI 红了只能看到
      # 「exit code 1」，看不出是哪条 lint 规则。
      - name: Lint
        shell: bash
        run: |
          set +e
          ./gradlew --console=plain :app:lintDebug
          code=$?
          if [ "$code" -ne 0 ]; then
            echo "::error::Lint failed (exit $code)"
            report=app/build/reports/lint-results-debug.txt
            if [ -f "$report" ]; then
              # 只发前 40 条错误行，避免刷爆注解配额。
              grep -n -m 200 -E "Error:|error:" "$report" | head -40 | while IFS= read -r line; do
                echo "::error file=app/build/reports/lint-results-debug.txt::${line}"
              done
            else
              echo "::error::lint report missing at $report"
            fi
          fi
          exit "$code"

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.*
          retention-days: 14

  # 宿主侧插件是我们**手改过**的（`src/host/channel.js`、`dshm-timeline.js`、`browser.js`…），
  # 但它的 57 个 Node 测试以前不在任何流水线上 —— 改坏了只有真机才发现（例如给
  # `channel.js` 加端点时写错 `READS` 集合）。依赖随仓库提交，不需要 npm install。
  plugin-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # 与运行时一致用 Node 24（`runtime/build-runtime.sh` 装的就是 24.x）。
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Host plugin tests
        working-directory: app/src/main/assets/ds-bot
        run: npm test

